
[project]
name = "super-rlm-protocol"
version = "0.1.0"
description = "Language-neutral contract models for super-RLM"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/super_rlm_protocol"]
