# Project model registry.
#
# `default` selects the provider/model the CLI starts Router and Worker with.
# SUPER_RLM_PRIME_PROVIDER / SUPER_RLM_PRIME_MODEL override it.
#
# The API key is referenced, never committed. Put DEEPSEEK_API_KEY in
# <SUPER_RLM_HOME>/secrets/providers.env or the process environment.

default:
  provider: deepseek
  model: deepseek-flash
  thinking: medium

providers:
  deepseek:
    name: DeepSeek
    api: openai-completions
    baseUrl: https://api.deepseek.com/v1
    apiKey: $DEEPSEEK_API_KEY
    authHeader: true
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        api: openai-completions
        reasoning: true
        input: [text, image]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        contextWindow: 1048576
        maxTokens: 393216
        thinkingLevelMap:
          off: null
          minimal: low
          low: low
          medium: high
          high: high
          xhigh: max
          max: max
