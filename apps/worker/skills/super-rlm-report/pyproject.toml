[project]
name = "super-rlm-report"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx"]

[project.scripts]
super_rlm_report = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/super_rlm_report"]
