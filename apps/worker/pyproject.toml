
[project]
name = "super-rlm-worker"
version = "0.1.0"
description = "super-RLM Worker: Prime Agent ACP adapter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.10",
  "super-rlm-protocol",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "agent-client-protocol>=1.0.0rc3"]

[tool.uv.sources]
super-rlm-protocol = { path = "../../packages/protocol/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/super_rlm_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]
